spring:
  application:
    name: planar

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false

# Railway injects PORT and routes the public URL to it; fall back to 8080 locally.
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true

planar:
  rate-limiter:
    capacity: 60
    refill-rate: 10
    refill-interval-seconds: 1